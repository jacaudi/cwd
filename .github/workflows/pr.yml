---
name: PR Validation

"on":
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Lint Go ────────────────────────────────────────────────────────────────
  lint-go:
    name: Lint Go
    uses: jacaudi/github-actions/.github/workflows/component-lint.yml@v0.20.1
    permissions:
      contents: read
    with:
      go: true
      go-version: ${{ vars.GO_VERSION || '1.24' }}

  # ── Lint config files (YAML + JSON) ───────────────────────────────────────
  lint-config:
    name: Lint Config
    uses: jacaudi/github-actions/.github/workflows/component-lint.yml@v0.20.1
    permissions:
      contents: read
    with:
      yaml: true
      yamllint-config: .yamllint.yml

  # ── Test Go ────────────────────────────────────────────────────────────────
  test-go:
    name: Test Go
    uses: jacaudi/github-actions/.github/workflows/component-test.yml@v0.20.1
    permissions:
      contents: read
    with:
      test-framework: go
      go-version: ${{ vars.GO_VERSION || '1.24' }}
      coverage: true
      coverage-threshold: ${{ fromJSON(vars.COVERAGE_THRESHOLD || '0') }}
      # Embed placeholder is committed so go build/test does not require
      # the SPA to be built first.
      artifact-name: test-results-go

  # ── Test Web (typecheck + build via pnpm) ─────────────────────────────────
  # No Vitest suite yet (Phase 0); typecheck + build is the green-bar contract.
  test-web:
    name: Test Web
    uses: jacaudi/github-actions/.github/workflows/component-test.yml@v0.20.1
    permissions:
      contents: read
    with:
      test-framework: custom
      working-directory: web
      node-version: '24'
      install-dependencies: false
      # setup-command runs from repo ROOT (not working-directory) per the
      # reusable workflow contract. test-command runs from working-directory.
      setup-command: |
        corepack enable
        corepack prepare pnpm@9.12.2 --activate
        cd web && pnpm install --frozen-lockfile
      test-command: |
        pnpm typecheck && pnpm build
      artifact-name: test-results-web
